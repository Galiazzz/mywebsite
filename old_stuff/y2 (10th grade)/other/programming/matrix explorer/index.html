<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Explorer</title>
    <link rel="stylesheet" href="index.css">
</head>
<body onload="LoadStuff()">
    <canvas id="canvas"></canvas>
    <div id="inputBar" onmouseover="isInteractingWithCanvas = false;" onmouseout="isInteractingWithCanvas = true;">
        <ul id="matrixValues">
            <li><input type="number" class="mv" value="1"><input type="number" class="mv" value="0"></li>
            <li><input type="number" class="mv" value="0"><input type="number" class="mv" value="1"></li>
        </ul>
        <button id="goTransform" onclick="TransformPoints()">Go Transform!</button>
    </div>
    <script src="../../../../overarching/libraries/import.js"></script>
    <script src="index.js"></script>    
</body>
</html>
