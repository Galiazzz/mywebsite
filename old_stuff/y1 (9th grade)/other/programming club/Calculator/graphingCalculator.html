<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Graphing Calculator</title>
    <link rel="stylesheet" href="index.css">
    <style>
        body{
            text-align: center;
        }
        canvas{
            margin-left: 20px;
            background:rgb(133, 119, 39);
        }
        #colorInputbox{
            text-align: center;
        }
        input{
            margin-bottom: 10px;
        }
    </style>
</head>

<body onload="LoadStuff()">
    <div id="sideNav">
        <ul>
            <div class="hamburger"></div>
            <div class="hamburger"></div>
            <div class="hamburger"></div>
        </ul>

        <div>
            <p>Navigation</p>
            <ul>
                <li><a href="index.html">Standard Calculator</a></li>
                <li><a href="factoringCalculator.html">Factoring Calculator</a></li>
                <li><a href="#">Graphing Calculator</a></li>
                <li><a href="mathBitsAndBobs.html">Math Bits and Bobs</a></li>
            </ul>
            <p>Useful Stuff</p>
            <ul id="usefulStuff">
                <li><button onclick="DisplayScratchPaper()">Open Scratch Paper</button></li>
                <li><button onclick="CloseScratchPaper()">Close Scratch Paper</button></li>
                <li><a href="controls.html">Controls</a></li>
            </ul>
        </div>
    </div>
    <span style="color: white">y = </span>
    <input type="text" placeholder="eqastion" id="equastion">
    <br>
    <button onclick="CreateGraph()">Graph</button>
    <br>
    <canvas id="graphArea"></canvas>
    <div id="colorInputBox">
        <input type="color" id="colorInput" oninput="ColorChange()">
    </div>
    
    <textarea name="" id="scatchPaper" cols="50" rows="10"
        placeholder="This is scratch paper. Use the bottom-left hand corner to re-size me."></textarea>
    <script src="graphingCalculator.js"></script>
