<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>viewer</title>
</head>
<body>
	<div id="aladin-lite-div" style="width:400px;height:400px;overflow:none;"></div>
	<script type="text/javascript" src="https://aladin.u-strasbg.fr/AladinLite/api/v3/latest/aladin.js" charset="utf-8"></script>
	<script type="text/javascript">
		var aladin;
		A.init.then(() => {
		    aladin = A.aladin('#aladin-lite-div', {fov: 0.5, target: "20 45 38.0 +30 42 30", survey: "P/DSS2/color", showFullscreenControl: false, showSimbadPointerControl: true, showGotoControl:false});
		});

		
		window.addEventListener("message", function(e){
			var info = e.data.split("\n");
			if(info[0] == "setCoords"){
				aladin.gotoRaDec(parseFloat(info[1]), parseFloat(info[2]));
			}
		})
		
	</script>
</body>
</html>
